<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Website REVSCOLL STORE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
        }
        .document-image {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .store-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .description {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .legal-info {
            background-color: #eaeaea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #444;
        }
        .visit-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .visit-btn:hover {
            background-color: #0056b3;
        }

</head>
<body>

<div class="container">
    <!-- Gambar Dokumen Legalitas (Masukkan link gambar Anda di bawah) -->

        <strong>PT REVS COLL SHOES MANDIRI</strong><br>
        Nomor AHU: <strong>AHU-056496.AH.01.30.Tahun 2024</strong>
    </div>

    <!-- Link ke Website (Ganti '#' dengan URL website Anda) -->
    <a href="index.html" class="visit-btn" target="_blank">Kembali ke beranda</a>
</div>

</html>
